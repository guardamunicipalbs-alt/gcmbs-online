<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCMBS — acesso atualizado</title><style>body{font-family:system-ui,Arial,sans-serif;background:#f3f6fb;color:#15345c;margin:0;padding:30px}main{max-width:600px;margin:8vh auto;background:#fff;border:1px solid #dae3ef;border-radius:14px;padding:24px}a{color:#1456a8}</style></head><body><main id="status" role="status"><h1>GCMBS Online</h1><p>Carregando a versão atualizada do Banco de Horas, sem reutilizar arquivos antigos...</p></main><script>

</script></body></html>
